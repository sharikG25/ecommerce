spring.application.name=catalog
server.port=${CATALOG_PORT:8081}

spring.datasource.url=${CATALOG_DB_URL:jdbc:postgresql://localhost:5432/ecommerce_catalog}
spring.datasource.username=${CATALOG_DB_USERNAME}
spring.datasource.password=${CATALOG_DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

auth.service.url=${AUTH_SERVICE_URL:http://localhost:8080}
